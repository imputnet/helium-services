name: images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  list:
    name: list images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: list
        run: |
          dirs=$(find svc util -mindepth 2 -maxdepth 2 -name Dockerfile -exec dirname {} \; | sort)

          if git cat-file -e "$BASE^{commit}" 2>/dev/null \
            && git diff --quiet "$BASE" HEAD -- .github/workflows/images.yml; then
            dirs=$(comm -12 <(echo "$dirs") <(git diff --name-only "$BASE" HEAD | cut -d/ -f1,2 | sort -u))
          fi

          images=$(echo "$dirs" | jq -Rcs 'split("\n") | map(select(length > 0) | {dir: ., name: split("/")[-1]})')
          echo "images=$images" >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  build:
    name: ${{ matrix.name }}
    needs: list
    if: needs.list.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: free disk space
        if: matrix.dir == 'svc/components'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.dir }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
