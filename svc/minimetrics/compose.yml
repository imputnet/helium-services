services:
    app:
        build: .
        restart: unless-stopped
        user: '${APP_UID:-1000}:${APP_GID:-1000}'
        read_only: true
        cap_drop: [ALL]
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp
        ports:
            - '127.0.0.1:${PORT:-8080}:8080'
        environment:
            PORT: '8080'
            DATA_DIR: /data
            GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set in .env}
            GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set in .env}
            GITHUB_ORG: ${GITHUB_ORG:?set in .env}
            SESSION_SECRET: ${SESSION_SECRET:?set in .env}
            NAMES_UPLOAD_TOKEN: ${NAMES_UPLOAD_TOKEN:?set in .env}
            PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set in .env}
            MAX_LOG_SIZE_MB: ${MAX_LOG_SIZE_MB:-10}
            RETENTION_DAYS: ${RETENTION_DAYS:-90}
            RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
            MIN_USERS: ${MIN_USERS:-5}
            HISTOGRAM_ALLOWLIST: ${HISTOGRAM_ALLOWLIST:-}
        volumes:
            - ./data:/data
