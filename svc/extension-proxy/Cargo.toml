[package]
name = "extension-proxy"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
omaha-protocol = "0.3"
omaha-server = { version = "0.1.7", features = ["metrics", "serve"] }
cup2 = "1"
aws-lc-rs = "1"
base64 = "0.22"
bytes = "1"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
rand = "0.9"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-service = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
url = "2"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
